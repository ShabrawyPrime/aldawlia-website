:root{color-scheme:dark;--night:#070B14;--ice:#EEF3FA;--mist:#93A4BD;--frost:#22D3EE;--sun:#F6B61D;--line:rgba(255,255,255,.14)}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ice)}
body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
.g{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px 16px;overflow:hidden;box-sizing:border-box}
.g::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 20%,transparent 80%);mask-image:radial-gradient(70% 70% at 50% 45%,#000 20%,transparent 80%)}

.c{position:relative;z-index:1;width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.marks{display:flex;flex-direction:column;align-items:center;gap:14px}
.emb{background:#FFFFFF;border-radius:16px;padding:12px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45);margin-bottom:10px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.emb img{display:block;width:clamp(132px,34vw,168px);height:auto}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.marks svg{height:34px;width:auto;max-width:100%}
.marks svg+svg{height:40px}
.bar{position:relative;width:min(360px,80vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;inset:0;background:linear-gradient(90deg,var(--frost),var(--sun));transform-origin:0 50%;animation:fill 1.2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.st{min-height:3.2em;font-size:15px;line-height:1.6;color:var(--mist)}
.st b{color:var(--ice);font-weight:600}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btns a{display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:50px;padding:12px 22px;border:1px solid var(--line);border-radius:4px;color:var(--ice);text-decoration:none;font-weight:600;font-size:16px;transition:border-color .2s,color .2s,background-color .2s}
.btns a:hover,.btns a:focus-visible{border-color:var(--frost);color:var(--frost);outline:none}
.btns a.is-pick{background:var(--frost);border-color:var(--frost);color:#04212B}
.btns a[lang="ar"]{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:17px}
.note{font-size:13px;line-height:1.7;color:var(--mist);max-width:44ch}
.note span{display:block}
.note span[lang="ar"]{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i,.emb{animation:none}}
</style>
