{%- from 'macros.html' import icon with context -%}
<section class="s cta" aria-labelledby="h-cta">
  <div class="glow"></div><div class="gridbg"></div>
  <div class="wrap" style="position:relative">
    <div class="cta__in">
      <div class="stack" style="gap:18px">
        <h2 class="h2" id="h-cta">{{ t(CTA.title) }}</h2>
        <p class="lead">{{ t(CTA.text) }}</p>
      </div>
      <div class="btns">
        <a class="btn btn--frost" href="contact.html">{{ t(UI.start_project) }} {{ icon('arrow') }}</a>
        <a class="btn btn--ghost" href="group.html">{{ t(UI.explore_group) }}</a>
      </div>
    </div>
  </div>
</section>
